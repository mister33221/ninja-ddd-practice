name: Ninja-ddd-practice CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Generate version number
      id: version
      run: |
        VERSION="$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build ninja-backend
      run: |
        cd ./ninja-backend  
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Upload backend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-dist
        path: ninja-backend/target

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '19.4.0'

    - name: Build ninja-frontend
      run: |
        cd ./ninja-frontend  
        npm install --legacy-peer-deps
        npm run build -- --configuration production

    - name: Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: ninja-frontend/dist

  push:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-dist
        path: ninja-backend/target

    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: ninja-frontend/dist

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ninja-backend
        push: true
        tags: |
          vincentkai/ninja-backend:latest
          vincentkai/ninja-backend:${{ needs.build-backend.outputs.version }}

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ninja-frontend
        push: true
        tags: |
          vincentkai/ninja-frontend:latest
          vincentkai/ninja-frontend:${{ needs.build-backend.outputs.version }}

  release:
    needs: [push]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-dist
        path: dist/backend

    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: dist/frontend

    - name: Create release assets
      run: |
        mkdir -p release-assets
        
        # 後端 JAR 檔案
        find dist/backend -name "*.jar" -exec cp {} release-assets/ \;
        
        # 前端打包壓縮
        cd dist/frontend
        zip -r ../../release-assets/frontend.zip .
        cd ../..

    - name: Create GitHub Release + Tag
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.build-backend.outputs.version }}
        name: Release v${{ needs.build-backend.outputs.version }}
        body: |
          Auto-generated release for v${{ needs.build-backend.outputs.version }}.
        draft: false
        prerelease: false
        files: |
          release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [build-backend, build-frontend, push, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Send email notification
      uses: dawidd6/action-send-mail@v2
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASS }}
        subject: "Ninja DDD - Release v${{ needs.build-backend.outputs.version }} Deployment Status"
        body: |
          版本號: v${{ needs.build-backend.outputs.version }}
          
          部署結果:
          Backend build: ${{ needs.build-backend.result }}
          Frontend build: ${{ needs.build-frontend.result }}
          Docker push: ${{ needs.push.result }}
          Release: ${{ needs.release.result }}

          Commit message: ${{ github.event.head_commit.message }}

          查看 Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.build-backend.outputs.version }}
          查看工作流程詳情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: mister33221@gmail.com
        from: GitHub Actions
