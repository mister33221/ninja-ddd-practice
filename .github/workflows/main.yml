name: Ninja-ddd-practice CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
    - uses: actions/checkout@v2

    - name: Generate version number
      id: version
      run: |
        echo "VERSION=$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: Build ninja-backend
      run: |
        cd ./ninja-backend  
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Upload backend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-dist
        path: ninja-backend/target

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '19.4.0'

    - name: Build ninja-frontend
      run: |
        cd ./ninja-frontend  
        npm install --legacy-peer-deps
        npm run build -- --configuration production

    - name: Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: ninja-frontend/dist

  push:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-dist
        path: ninja-backend/target

    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: ninja-frontend/dist

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./ninja-backend
        push: true
        tags: |
          vincentkai/ninja-backend:latest
          vincentkai/ninja-backend:${{ needs.build-backend.outputs.version }}

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./ninja-frontend
        push: true
        tags: |
          vincentkai/ninja-frontend:latest
          vincentkai/ninja-frontend:${{ needs.build-backend.outputs.version }}
  notify:
    needs: [push, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Send email notification
      uses: dawidd6/action-send-mail@v2
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASS }}
        subject: "Ninja DDD - Release v${{ needs.build-backend.outputs.version }} Deployment Status"
        body: |
          版本號: v${{ needs.build-backend.outputs.version }}
          
          部署結果:
          Backend build: ${{ needs.build-backend.result }}
          Frontend build: ${{ needs.build-frontend.result }}
          Docker push: ${{ needs.push.result }}
          Release: ${{ needs.release.result }}

          Commit message: ${{ github.event.head_commit.message }}

          查看 GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.build-backend.outputs.version }}
          查看工作流程詳情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: mister33221@gmail.com
        from: GitHub Actions

  release:
    needs: [build-backend, push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:    
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0  # 獲取完整 git 歷史
        token: ${{ secrets.PAT }}
    
    # 下載構建成品 (可選，如果你想附加到 Release)
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-dist
        path: dist/backend
    
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: dist/frontend
    
    # 生成 Changelog (簡單版本)
    - name: Generate changelog
      id: changelog
      run: |
        echo "# Release ${{ needs.build-backend.outputs.version }}" > CHANGELOG.md
        echo "Generated on $(date)" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Changes" >> CHANGELOG.md
        
        # 從最近的標籤以來獲取提交
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -n "$LATEST_TAG" ]; then
          git log $LATEST_TAG..HEAD --pretty=format:"* %s" >> CHANGELOG.md
        else
          git log -10 --pretty=format:"* %s" >> CHANGELOG.md
        fi
    
    # 創建 ZIP 封裝的發布資產
    - name: Create release assets
      run: |
        mkdir -p release-assets
        
        # 後端 JAR 檔案
        find dist/backend -name "*.jar" -exec cp {} release-assets/ \;
        
        # 前端打包
        cd dist/frontend
        zip -r ../../release-assets/frontend.zip .
        cd ../..
    
    # 建立 Git tag
    - name: Create Git tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 檢查 tag 是否已存在
        if ! git rev-parse "v${{ needs.build-backend.outputs.version }}" >/dev/null 2>&1; then
          git tag -a "v${{ needs.build-backend.outputs.version }}" -m "Release v${{ needs.build-backend.outputs.version }}"
          git push origin "v${{ needs.build-backend.outputs.version }}"
        else
          echo "Tag v${{ needs.build-backend.outputs.version }} already exists"
        fi
    
    # 創建 GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.build-backend.outputs.version }}
        name: Release v${{ needs.build-backend.outputs.version }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        files: |
          release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
