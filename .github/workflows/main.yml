name: Ninja-ddd-practice CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
    - name: Release Please
      id: release
      uses: google-github-actions/release-please-action@v4
      with:
        release-type: node  # 或選擇 java 或 combined，視你的專案型態
        package-name: ninja-ddd-practice

  build-backend:
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    needs: release
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'adopt'
    - name: Build ninja-backend
      run: |
        cd ./ninja-backend  
        chmod +x mvnw
        ./mvnw clean package -DskipTests
    - name: Upload backend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-dist
        path: ninja-backend/target

  build-frontend:
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    needs: release
    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '19.4.0'
    - name: Build ninja-frontend
      run: |
        cd ./ninja-frontend  
        npm install --legacy-peer-deps
        npm run build -- --configuration production
    - name: Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: ninja-frontend/dist

  push:
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
    - uses: actions/checkout@v2
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-dist
        path: ninja-backend/target
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: ninja-frontend/dist
    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Build and push backend Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./ninja-backend
        push: true
        tags: |
          vincentkai/ninja-backend:latest
          vincentkai/ninja-backend:${{ needs.release.outputs.tag_name }}
    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./ninja-frontend
        push: true
        tags: |
          vincentkai/ninja-frontend:latest
          vincentkai/ninja-frontend:${{ needs.release.outputs.tag_name }}

  notify:
    needs: [push]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Send email notification
      uses: dawidd6/action-send-mail@v2
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASS }}
        subject: GitHub Actions job result for ${{ github.repository }}
        body: |
          Release: ${{ needs.release.result }}
          Backend build: ${{ needs.build-backend.result }}
          Frontend build: ${{ needs.build-frontend.result }}
          Push: ${{ needs.push.result }}
          Tag: ${{ needs.release.outputs.tag_name }}

          Commit message: ${{ github.event.head_commit.message }}

          See details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: mister33221@gmail.com
        from: GitHub Actions
